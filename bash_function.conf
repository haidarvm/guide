function wkh() {
  local url="${1#http://}"
  url="${url#https://}"
  
  wrk -t12 -c400 -d5s "http://$url"
}

unhd() {
local disk="/dev/$1"
    
    if [ -z "$1" ]; then
        echo "Gunakan: offdisk sdb"
        return 1
    fi

    echo "Melepas semua partisi di $disk..."
    
    # 1. Unmount semua partisi yang terkait dengan disk tersebut
    # Mengambil semua partisi dari /dev/sdbX dan unmount satu per satu
    lsblk -ln -o NAME "$disk" | xargs -I {} udisksctl unmount -b /dev/{} 2>/dev/null

    # 2. Power off drive fisik
    echo "Mematikan daya drive $disk..."
    udisksctl power-off -b "$disk"

    if [ $? -eq 0 ]; then
        echo "Berhasil! Harddisk aman dicabut."
    else
        echo "Gagal mematikan daya. Pastikan tidak ada file yang sedang terbuka."
    fi
}

# Fungsi untuk replace teks: rep [cari] [ganti] [file]
rep() {
  sudo sed -i "s/$1/$2/g" "$3"
}

function ceksholat() {
    local ID="eda80a3d5b344bc40f3bc04f65b7a357" 
    
    # Format TANGGAL wajib: YYYY/MM/DD (bukan YYYY-MM-DD)
    local TANGGAL=$(date +"%Y/%m/%d")
    
    local URL="https://api.myquran.com/v3/sholat/jadwal/${ID}/${TANGGAL}"

    # Mengambil data & memfilter
    curl -s "$URL" | jq -r '
      if .status == false then
        "Error: \(.message)"
      else
        .data.jadwal | 
        "=======================",
        "   JADWAL SHOLAT",
        "   \(.tanggal // "Tanggal Tidak Ditemukan")",
        "=======================",
        "Subuh   : \(.subuh)",
        "Dzuhur  : \(.dzuhur)",
        "Ashar   : \(.ashar)",
        "Maghrib : \(.maghrib)",
        "Isya    : \(.isya)",
        "======================="
      end
    '
}

# Fungsi Sprite Maker di Bash
apim() {
    local mode=$1
    shift # Hapus argumen pertama (h/v) dari daftar
    
    # Ambil argumen terakhir sebagai output
    local output="${@: -1}"
    # Ambil semua argumen kecuali yang terakhir sebagai input
    local inputs=("${@:1:$(($#-1))}")

    if [[ "$mode" == "h" ]]; then
        magick "${inputs[@]}" +append "$output"
        echo "✅ Sprite Horizontal dibuat: $output"
    elif [[ "$mode" == "v" ]]; then
        magick "${inputs[@]}" -append "$output"
        echo "✅ Sprite Vertikal dibuat: $output"
    else
        echo "Cara pakai: apim [h|v] file1.png file2.png output.png"
    fi
}

# Alias/Fungsi untuk Alacritty + Tmux 3 Pane dengan htop di atas
tmux-htop() {
    # 1. Buat sesi baru (Window 1) dengan htop dan beri nama 'home'
    tmux new-session -d -s haidar -n 'home' 'htop'
    
    # 2. Split vertikal: berikan 40% untuk pane bawah (htop atas dapat 60%)
    tmux split-window -v -p 20 -t haidar:0.0
    
    # 3. Split horizontal pane bawah menjadi 2 bagian
    tmux split-window -v -t haidar:0.1
    
    # 4. Buat Window 2 baru dengan 1 pane dan beri nama 'other'
    tmux new-window -t haidar -n 'other'
    
    # 5. Pindahkan fokus kembali ke Window 1 ('home')
    tmux select-window -t haidar:0
    
    # 6. Masuk ke sesi tmux
    tmux attach-session -t haidar
}
